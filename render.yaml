services:
  - type: web
    name: novafetch-backend
    env: node
    plan: free
    buildCommand: "npm install && pip3 install -U yt-dlp && echo 'Build complete: yt-dlp' && yt-dlp --version"
    startCommand: "pip3 install -U yt-dlp 2>/dev/null || true; npm run server"
    envVars:
      - key: NODE_ENV
        value: production
