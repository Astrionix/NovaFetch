<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0512"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="50%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Film strip holes left -->
  <rect x="30" y="60" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="30" y="100" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="30" y="140" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="30" y="350" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="30" y="390" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="30" y="430" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Film strip holes right -->
  <rect x="462" y="60" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="462" y="100" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="462" y="140" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="462" y="350" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="462" y="390" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="462" y="430" width="20" height="14" rx="3" fill="#0a0a0a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Play triangle -->
  <polygon points="200,170 200,342 350,256" fill="url(#gold)" filter="url(#glow)" opacity="0.9"/>
  <!-- NF text -->
  <text x="256" y="440" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="60" fill="url(#gold)" letter-spacing="8" filter="url(#glow)">NF</text>
</svg>
